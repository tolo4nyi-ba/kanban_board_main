<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Канбан-дошка — планування завдань</title>
<meta name="description" content="Проста канбан-дошка для планування завдань: колонки «Зробити», «У роботі», «Готово», пріоритети й кольорові мітки. Дані зберігаються лише у вашому браузері.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Попередній перегляд посилання в месенджерах і соцмережах (без картинки) -->
<meta property="og:type" content="website">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Канбан-дошка — планування завдань">
<meta property="og:description" content="Проста канбан-дошка: колонки «Зробити», «У роботі», «Готово», пріоритети й кольорові мітки. Дані зберігаються лише у вашому браузері.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Канбан-дошка — планування завдань">
<meta name="twitter:description" content="Проста канбан-дошка: колонки «Зробити», «У роботі», «Готово», пріоритети й кольорові мітки. Дані зберігаються лише у вашому браузері.">
<script>
  // Застосувати збережену тему до відмальовування, щоб сторінка не блимала
  try {
    const saved = localStorage.getItem('kanban-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch {}
</script>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --column: #eceef3;
    --text: #1d2130;
    --muted: #6b7185;
    --border: #dde0e8;
    --accent: #4f5bd5;
    --accent-hover: #3f4ac0;
    --danger: #d64545;
    --warning-bg: #fff4dc;
    --warning-text: #7a5300;
    --toast-bg: #1d2130;
    --toast-text: #f4f5f8;
    --todo: #8a94ad;
    --doing: #e0a030;
    --done: #3aa569;
    --label-yellow: #e8b923;
    --label-blue: #3b82f6;
    --label-red: #e04848;
    --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 2px 8px rgba(20, 24, 40, .05);
  }
  /* Темна тема: вибір користувача або системне налаштування, якщо вибору ще немає */
  :root[data-theme="dark"] {
    --bg: #14161d;
    --surface: #1f222c;
    --column: #191b23;
    --text: #e6e8ef;
    --muted: #949aae;
    --border: #2c303d;
    --accent: #7480f0;
    --accent-hover: #8a95f5;
    --danger: #ef6b6b;
    --warning-bg: #3a2f14;
    --warning-text: #f3d48a;
    --toast-bg: #e6e8ef;
    --toast-text: #14161d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161d;
      --surface: #1f222c;
      --column: #191b23;
      --text: #e6e8ef;
      --muted: #949aae;
      --border: #2c303d;
      --accent: #7480f0;
      --accent-hover: #8a95f5;
      --danger: #ef6b6b;
      --warning-bg: #3a2f14;
      --warning-text: #f3d48a;
      --toast-bg: #e6e8ef;
      --toast-text: #14161d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Фон: хвилі Назаре під напівпрозорим шаром кольору теми, щоб текст лишався читабельним */
    background:
      linear-gradient(var(--overlay), var(--overlay)),
      url("https://upload.wikimedia.org/wikipedia/commons/e/ee/Praia_Do_Norte_Nazar%C3%A9_High_Waves_%28205617995%29.jpeg") center / cover fixed no-repeat,
      var(--bg);
    color: var(--text);
    line-height: 1.45;
    min-height: 100vh;
  }
  :root { --overlay: rgba(244, 245, 248, .62); }
  :root[data-theme="dark"] { --overlay: rgba(14, 16, 22, .7); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --overlay: rgba(14, 16, 22, .7); }
  }
  h1 { text-shadow: 0 1px 12px var(--bg); }
  .subtitle { text-shadow: 0 1px 8px var(--bg); }

  .credit {
    margin-top: 32px; text-align: center;
    font-size: .75rem; color: var(--muted);
  }
  .credit a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 96px; }
  header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    margin-bottom: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: -.01em; }
  .subtitle { margin: 0; color: var(--muted); }

  .theme-toggle {
    display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 8px 14px;
    font: inherit; font-size: .9rem; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .15s, color .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .icon { font-size: 1rem; line-height: 1; }

  .storage-warning {
    margin: 0 0 20px; padding: 12px 14px;
    background: var(--warning-bg); color: var(--warning-text);
    border-radius: 10px; font-size: .92rem;
  }

  form.add { margin-bottom: 24px; }
  .add-row { display: flex; gap: 8px; }
  form.add select {
    flex-shrink: 0;
    padding: 0 12px;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; outline: none;
  }
  form.add select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  form.add input {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  form.add input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .add-hint { margin: 6px 4px 0; font-size: .8rem; color: var(--muted); text-align: right; }
  .btn-primary {
    padding: 12px 20px;
    font: inherit; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    align-items: start;
  }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }

  .column {
    background: color-mix(in srgb, var(--column) 82%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
    min-height: 160px;
  }
  .column-head {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 4px 12px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .column[data-status="todo"] .dot { background: var(--todo); }
  .column[data-status="doing"] .dot { background: var(--doing); }
  .column[data-status="done"] .dot { background: var(--done); }
  .column-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
  .column-head .count { color: var(--muted); font-weight: 500; }

  .cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; box-shadow: var(--shadow);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .card-text { margin: 0 0 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .column[data-status="done"] .card-text { color: var(--muted); text-decoration: line-through; }
  .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .card-date { font-size: .75rem; color: var(--muted); }

  /* Мітка пріоритету: колір тексту підлаштовується під тему через змішування з --text */
  .priority {
    font-size: .72rem; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
    color: color-mix(in srgb, var(--prio) 70%, var(--text));
    background: color-mix(in srgb, var(--prio) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--prio) 35%, transparent);
  }
  .priority[data-priority="low"]    { --prio: #5f9e7a; }
  .priority[data-priority="medium"] { --prio: #d9922b; }
  .priority[data-priority="high"]   { --prio: #e04848; }
  .card-actions { display: flex; gap: 6px; }
  .card-actions button {
    font: inherit; font-size: .82rem;
    min-width: 34px; padding: 5px 10px; border-radius: 7px;
    color: var(--text); background: transparent;
    border: 1px solid var(--border); cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .card-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .card-actions button:disabled { opacity: .35; cursor: not-allowed; }
  .card-actions .delete { margin-left: auto; }
  .card-actions .delete:hover { border-color: var(--danger) !important; color: var(--danger) !important; }

  /* Кольорові мітки карток */
  .card[data-color] { border-left: 5px solid var(--label); }
  .card[data-color="yellow"] { --label: var(--label-yellow); }
  .card[data-color="blue"]   { --label: var(--label-blue); }
  .card[data-color="red"]    { --label: var(--label-red); }
  .card[data-color] { background: color-mix(in srgb, var(--label) 8%, var(--surface)); }

  .card-colors { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .card-colors .swatch {
    width: 18px; height: 18px; padding: 0;
    border-radius: 50%; border: 2px solid transparent;
    background: var(--swatch); cursor: pointer;
    box-shadow: 0 0 0 1px var(--border);
    transition: transform .12s, box-shadow .12s;
  }
  .card-colors .swatch:hover { transform: scale(1.15); }
  .card-colors .swatch[aria-pressed="true"] {
    border-color: var(--surface);
    box-shadow: 0 0 0 2px var(--swatch);
  }
  .card-colors .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty {
    text-align: center; color: var(--muted); font-size: .9rem;
    padding: 20px 8px; border: 1px dashed var(--border); border-radius: 10px;
  }

  /* Підказка для порожньої дошки */
  .board-empty {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 16px; padding: 14px 16px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px dashed var(--border); border-radius: 12px;
  }
  .board-empty[hidden] { display: none; }
  .board-empty p { margin: 0; font-weight: 500; }
  .board-empty button {
    padding: 8px 14px;
    font: inherit; font-size: .9rem; color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent); border-radius: 8px;
    cursor: pointer; transition: background .15s;
  }
  .board-empty button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    max-width: calc(100% - 32px);
    padding: 12px 12px 12px 18px;
    background: var(--toast-bg); color: var(--toast-text);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
    animation: slide .2s ease-out;
  }
  .toast[hidden] { display: none; }
  @keyframes slide { from { opacity: 0; transform: translate(-50%, 8px); } }
  .toast-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button {
    flex-shrink: 0;
    font: inherit; font-weight: 600; color: var(--toast-bg);
    background: var(--toast-text); border: 0; border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Канбан-дошка</h1>
      <p class="subtitle">Плануйте завдання й відстежуйте їхній прогрес.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="icon" aria-hidden="true"></span>
      <span class="label"></span>
    </button>
  </header>

  <p class="storage-warning" id="storage-warning" role="alert" hidden>
    Сховище браузера недоступне (можливо, увімкнено приватний режим). Дошка працює, але зміни не збережуться після оновлення сторінки.
  </p>

  <form class="add" id="add-form" autocomplete="off">
    <div class="add-row">
      <label class="visually-hidden" for="new-card">Текст нової картки</label>
      <input id="new-card" type="text" maxlength="200" placeholder="Нове завдання…" aria-describedby="char-count">
      <label class="visually-hidden" for="new-priority">Пріоритет</label>
      <select id="new-priority" title="Пріоритет">
        <option value="low">Низький</option>
        <option value="medium" selected>Середній</option>
        <option value="high">Високий</option>
      </select>
      <button class="btn-primary" id="add-button" type="submit" disabled>Додати</button>
    </div>
    <p class="add-hint" id="char-count">0 / 200</p>
  </form>

  <div class="board-empty" id="board-empty" hidden>
    <p>Додайте першу картку</p>
    <button type="button" id="add-examples">Додати приклади</button>
  </div>

  <main class="board" id="board"></main>

  <p class="credit">
    Фото: Прая-ду-Норте, Назаре —
    <a href="https://commons.wikimedia.org/wiki/File:Praia_Do_Norte_Nazar%C3%A9_High_Waves_(205617995).jpeg" target="_blank" rel="noopener">Luís Ascenso</a>,
    <a href="https://creativecommons.org/licenses/by/3.0/deed.uk" target="_blank" rel="noopener">CC BY 3.0</a>, Wikimedia Commons
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="toast-text" id="toast-text"></span>
  <button type="button" id="toast-undo">Скасувати</button>
</div>

<script>
  const STORAGE_KEY = 'kanban-cards';
  const THEME_KEY = 'kanban-theme';
  const MAX_LENGTH = 200;
  const UNDO_MS = 5000;
  const COLUMNS = [
    { id: 'todo',  title: 'Зробити' },
    { id: 'doing', title: 'У роботі' },
    { id: 'done',  title: 'Готово' },
  ];
  const COLORS = [
    { id: 'yellow', title: 'Жовтий' },
    { id: 'blue',   title: 'Синій' },
    { id: 'red',    title: 'Червоний' },
  ];
  const PRIORITIES = [
    { id: 'low',    title: 'Низький' },
    { id: 'medium', title: 'Середній' },
    { id: 'high',   title: 'Високий' },
  ];
  const DEFAULT_PRIORITY = 'medium';
  const EXAMPLES = [
    { text: 'Скласти план на тиждень',          status: 'todo',  priority: 'high',   color: null },
    { text: 'Купити продукти',                  status: 'todo',  priority: 'low',    color: 'yellow' },
    { text: 'Підготувати презентацію',          status: 'doing', priority: 'high',   color: 'red' },
    { text: 'Прочитати розділ книги',           status: 'doing', priority: 'medium', color: 'blue' },
    { text: 'Налаштувати канбан-дошку',         status: 'done',  priority: 'medium', color: null },
  ];

  const board = document.getElementById('board');
  const boardEmpty = document.getElementById('board-empty');
  const form = document.getElementById('add-form');
  const input = document.getElementById('new-card');
  const prioritySelect = document.getElementById('new-priority');
  const addButton = document.getElementById('add-button');
  const charCount = document.getElementById('char-count');
  const storageWarning = document.getElementById('storage-warning');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toast-text');
  const toastUndo = document.getElementById('toast-undo');
  const themeToggle = document.getElementById('theme-toggle');

  // ---------- Сховище ----------

  const storageAvailable = (() => {
    try {
      const probe = '__kanban_probe__';
      localStorage.setItem(probe, probe);
      localStorage.removeItem(probe);
      return true;
    } catch {
      return false;
    }
  })();

  function warnStorage() {
    storageWarning.hidden = false;
  }

  function load() {
    if (!storageAvailable) return [];
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!Array.isArray(data)) return [];
      // Лишаємо тільки коректні картки; старим карткам без дати ставимо поточну,
      // без пріоритету — «Середній»
      return data
        .filter(c => c && typeof c.text === 'string' && COLUMNS.some(col => col.id === c.status))
        .map(c => ({
          id: String(c.id || newId()),
          text: c.text,
          status: c.status,
          createdAt: c.createdAt || new Date().toISOString(),
          color: COLORS.some(col => col.id === c.color) ? c.color : null,
          priority: PRIORITIES.some(p => p.id === c.priority) ? c.priority : DEFAULT_PRIORITY,
        }));
    } catch {
      return [];
    }
  }

  function save() {
    if (!storageAvailable) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    } catch {
      warnStorage();
    }
  }

  // ---------- Дані ----------

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  let cards = load();
  // Масив зберігає порядок: картки колонки показуються в порядку появи в масиві

  function addCard(text, priority) {
    if (!PRIORITIES.some(p => p.id === priority)) priority = DEFAULT_PRIORITY;
    cards.push({ id: newId(), text, status: 'todo', createdAt: new Date().toISOString(), color: null, priority });
    save();
    render();
  }

  function addExamples() {
    const createdAt = new Date().toISOString();
    EXAMPLES.forEach(example => cards.push({ id: newId(), createdAt, ...example }));
    save();
    render();
  }

  document.getElementById('add-examples').addEventListener('click', addExamples);

  function setColor(id, color) {
    const card = cards.find(c => c.id === id);
    if (!card) return;
    // Повторне натискання на вибраний колір знімає мітку
    card.color = card.color === color ? null : color;
    save();
    render();
  }

  function moveCard(id, status) {
    const index = cards.findIndex(c => c.id === id);
    if (index === -1) return;
    const [card] = cards.splice(index, 1);
    card.status = status;
    cards.push(card); // у кінець цільової колонки
    save();
    render();
  }

  let pendingUndo = null;
  let toastTimer = null;

  function deleteCard(id) {
    const index = cards.findIndex(c => c.id === id);
    if (index === -1) return;
    const [card] = cards.splice(index, 1);
    save();
    render();
    showUndoToast(card, index);
  }

  function showUndoToast(card, index) {
    pendingUndo = { card, index };
    const preview = card.text.length > 40 ? card.text.slice(0, 40) + '…' : card.text;
    toastText.textContent = `Картку «${preview}» видалено`;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, UNDO_MS);
  }

  function hideToast() {
    toast.hidden = true;
    pendingUndo = null;
    clearTimeout(toastTimer);
  }

  toastUndo.addEventListener('click', () => {
    if (!pendingUndo) return;
    const { card, index } = pendingUndo;
    cards.splice(Math.min(index, cards.length), 0, card);
    save();
    render();
    hideToast();
  });

  // ---------- Відмальовування ----------

  function formatDate(iso) {
    const date = new Date(iso);
    if (isNaN(date)) return '';
    return date.toLocaleString('uk-UA', {
      day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
    });
  }

  function moveButton(label, target, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (target) {
      const hint = `Перемістити в «${target.title}»`;
      b.title = hint;
      b.setAttribute('aria-label', hint);
      b.addEventListener('click', onClick);
    } else {
      b.disabled = true;
      b.setAttribute('aria-hidden', 'true');
    }
    return b;
  }

  function render() {
    board.replaceChildren();
    boardEmpty.hidden = cards.length > 0;

    COLUMNS.forEach((col, index) => {
      const items = cards.filter(c => c.status === col.id);
      const prev = COLUMNS[index - 1];
      const next = COLUMNS[index + 1];

      const section = document.createElement('section');
      section.className = 'column';
      section.dataset.status = col.id;
      section.setAttribute('aria-label', `${col.title}, карток: ${items.length}`);

      const head = document.createElement('div');
      head.className = 'column-head';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const h2 = document.createElement('h2');
      h2.textContent = col.title + ' ';
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = `(${items.length})`;
      h2.append(count);
      head.append(dot, h2);
      section.append(head);

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Тут поки порожньо';
        section.append(empty);
      } else {
        const list = document.createElement('ul');
        list.className = 'cards';
        items.forEach(card => {
          const li = document.createElement('li');
          li.className = 'card';
          if (card.color) li.dataset.color = card.color;

          const p = document.createElement('p');
          p.className = 'card-text';
          p.textContent = card.text; // лише текст, без HTML

          const time = document.createElement('time');
          time.className = 'card-date';
          time.dateTime = card.createdAt;
          time.textContent = 'Створено ' + formatDate(card.createdAt);

          const priority = PRIORITIES.find(p => p.id === card.priority);
          const badge = document.createElement('span');
          badge.className = 'priority';
          badge.dataset.priority = priority.id;
          badge.textContent = priority.title;
          badge.title = 'Пріоритет: ' + priority.title;

          const meta = document.createElement('div');
          meta.className = 'card-meta';
          meta.append(badge, time);

          const actions = document.createElement('div');
          actions.className = 'card-actions';
          actions.append(
            moveButton('←', prev, () => moveCard(card.id, prev.id)),
            moveButton('→', next, () => moveCard(card.id, next.id)),
          );
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'delete';
          del.textContent = 'Видалити';
          del.addEventListener('click', () => deleteCard(card.id));
          actions.append(del);

          const colors = document.createElement('div');
          colors.className = 'card-colors';
          colors.setAttribute('role', 'group');
          colors.setAttribute('aria-label', 'Колір мітки');
          COLORS.forEach(color => {
            const selected = card.color === color.id;
            const swatch = document.createElement('button');
            swatch.type = 'button';
            swatch.className = 'swatch';
            swatch.style.setProperty('--swatch', `var(--label-${color.id})`);
            swatch.setAttribute('aria-pressed', String(selected));
            const hint = selected ? `Зняти мітку «${color.title}»` : `Позначити кольором «${color.title}»`;
            swatch.title = hint;
            swatch.setAttribute('aria-label', hint);
            swatch.addEventListener('click', () => setColor(card.id, color.id));
            colors.append(swatch);
          });

          li.append(p, meta, colors, actions);
          list.append(li);
        });
        section.append(list);
      }

      board.append(section);
    });
  }

  // ---------- Форма додавання ----------

  function updateAddState() {
    addButton.disabled = input.value.trim() === '';
    charCount.textContent = `${input.value.length} / ${MAX_LENGTH}`;
  }

  input.addEventListener('input', updateAddState);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim().slice(0, MAX_LENGTH);
    if (!text) {
      input.focus();
      return;
    }
    addCard(text, prioritySelect.value);
    input.value = '';
    updateAddState();
    input.focus();
  });

  // ---------- Тема ----------

  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

  function currentTheme() {
    return document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light');
  }

  function updateThemeButton() {
    const isDark = currentTheme() === 'dark';
    // Кнопка показує режим, на який вона перемкне
    themeToggle.querySelector('.icon').textContent = isDark ? '☀️' : '🌙';
    themeToggle.querySelector('.label').textContent = isDark ? 'Світла тема' : 'Темна тема';
    themeToggle.setAttribute('aria-label', isDark ? 'Увімкнути світлу тему' : 'Увімкнути темну тему');
  }

  themeToggle.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    if (storageAvailable) {
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    }
    updateThemeButton();
  });

  systemDark.addEventListener('change', updateThemeButton);

  // ---------- Старт ----------

  if (!storageAvailable) warnStorage();
  updateThemeButton();
  updateAddState();
  render();
  input.focus();
</script>
</body>
</html>
